<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantacarriera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: single mobile-first column, sticky club header, fixed bottom nav; one "pitch" flourish on the next-match card */
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --surface-2:#E6EBE5; --line:#D2DAD1;
  --fg:#13201A; --muted:#5A6A61; --accent:#17734A; --accent-fg:#FFFFFF;
  --gold:#A86E12; --bad:#B4372C; --good:#1E8A4F;
  --r-p:#C98A0C; --r-d:#2E8B4E; --r-c:#2F6FBF; --r-a:#C4423B;
  --shadow:0 1px 2px rgba(19,32,26,.06),0 6px 20px rgba(19,32,26,.06);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1611; --surface:#14211A; --surface-2:#1B2B22; --line:#2A3D32;
  --fg:#E4ECE6; --muted:#93A69A; --accent:#43B97F; --accent-fg:#06120C;
  --gold:#E2A946; --bad:#E57165; --good:#52C485;
  --r-p:#E8AE3A; --r-d:#4CB574; --r-c:#5D98E2; --r-a:#E46C64;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1611; --surface:#14211A; --surface-2:#1B2B22; --line:#2A3D32;
  --fg:#E4ECE6; --muted:#93A69A; --accent:#43B97F; --accent-fg:#06120C;
  --gold:#E2A946; --bad:#E57165; --good:#52C485;
  --r-p:#E8AE3A; --r-d:#4CB574; --r-c:#5D98E2; --r-a:#E46C64;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:720px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.top .who{flex:1;min-width:0}
.top h1{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-budget{font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--accent)}

main{display:flex;flex-direction:column;gap:22px;padding-block:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad)}
.btn.big{width:100%;padding:14px;font-size:16px;font-family:var(--f-display);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* next match: the pitch */
.next{position:relative;overflow:hidden;background:var(--accent);color:var(--accent-fg);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.next .pitch{position:absolute;inset:0;pointer-events:none;opacity:.16}
.next .pitch::before{content:"";position:absolute;left:50%;top:-10%;bottom:-10%;border-left:2px solid currentColor}
.next .pitch::after{content:"";position:absolute;left:50%;top:50%;width:150px;height:150px;border:2px solid currentColor;border-radius:50%;transform:translate(-50%,-50%)}
.next > *{position:relative}
.next .eyebrow{color:inherit;opacity:.8}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:16px 0 18px}
.vs .t{min-width:0}
.vs .t:last-child{text-align:right}
.vs .nm{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.02;text-transform:uppercase;overflow-wrap:anywhere}
.vs .ov{font-size:13px;opacity:.85;margin-top:4px}
.vs .x{font-family:var(--f-display);font-size:18px;opacity:.7}
.next .btn.big{background:var(--accent-fg);color:var(--accent);border-color:transparent}
.mine-mark{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:middle}

/* scoreboard */
.board{padding:16px}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.score .nm{font-weight:700;overflow-wrap:anywhere}
.score .nm.r{text-align:right}
.score .dig{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:.04em}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.scorers .r{text-align:right}
.res-list{display:flex;flex-direction:column}
.res{display:grid;grid-template-columns:1fr 58px 1fr;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.res:first-child{border-top:0}
.res .h{text-align:right}
.res .s{text-align:center;font-weight:700;background:var(--surface-2);border-radius:6px;padding:2px 0}
.res.me{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.res .h,.res .a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
th:nth-child(2),td:nth-child(2){text-align:left;width:100%}
td:first-child{color:var(--muted);width:28px}
tr.me td{background:color-mix(in srgb,var(--accent) 10%,transparent);font-weight:700}
td.pt{font-weight:800}
.form{display:inline-flex;gap:3px}
.form i{width:8px;height:8px;border-radius:2px;background:var(--line);display:inline-block}
.form i.V{background:var(--good)}.form i.P{background:var(--bad)}.form i.N{background:var(--muted)}

/* player rows */
.group-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prow{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.plist > .prow:first-child{border-top:0}
.role{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.role.P{background:var(--r-p)}.role.D{background:var(--r-d)}.role.C{background:var(--r-c)}.role.A{background:var(--r-a)}
:root[data-theme="dark"] .role{color:#0C1611}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .role{color:#0C1611}}
.pmain{min-width:0;background:none;border:0;padding:0;text-align:left}
.pname{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psub{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border:1px solid currentColor;border-radius:5px;padding:0 5px}
.tag.loan{color:var(--r-c)}
.ovr{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ovr b{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;min-width:30px;text-align:right}
.ovr small{font-size:11px;color:var(--muted)}
.o-gold{color:var(--gold)}.o-hi{color:var(--good)}.o-lo{color:var(--muted)}
.pips{display:inline-flex;gap:2px}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--line);display:inline-block}
.pips i.on{background:var(--gold)}
.st{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:none;display:grid;place-items:center;color:transparent}
.st svg{width:16px;height:16px}
.st[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.buy{font-weight:700;white-space:nowrap}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.field{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:16px;min-width:0}
.summary{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 14px}
.summary .k{font-size:12px;color:var(--muted)}
.summary .v{font-weight:800;font-size:18px}

/* rounds */
.rounds{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.rounds button{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.rounds button.done{background:var(--surface-2)}
.rounds button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.res .scr{grid-column:1/-1;font-size:12.5px;color:var(--muted);text-align:center}

/* news */
.news{display:flex;flex-direction:column}
.ni{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.news .ni:first-child{border-top:0}
.ni .when{font-size:11.5px;color:var(--muted);font-weight:600}
.ni.grow .txt b{color:var(--good)}.ni.decl .txt b{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.ni.grow .dot{background:var(--good)}.ni.decl .dot{background:var(--bad)}.ni.market .dot{background:var(--r-c)}.ni.season .dot{background:var(--gold)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,8,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:85%}}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.sheet .row .btn{flex:1 1 140px}
.sheet .stack{display:flex;flex-direction:column;gap:14px}
.bar{height:10px;border-radius:5px;background:var(--surface-2);position:relative;overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.bar em{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--gold) 45%,transparent);border-radius:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stats b{display:block;font-size:20px;font-weight:800}
.stats span{font-size:12px;color:var(--muted)}
.confirm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv b{font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13.5px}
textarea.field{width:100%;min-height:200px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5}

/* setup */
.setup{display:flex;flex-direction:column;gap:18px;padding-block:28px}
.brand{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,13vw,76px);line-height:.9;text-transform:uppercase;letter-spacing:.005em}
.brand span{color:var(--accent)}
.lead{font-size:16px;max-width:52ch;color:var(--muted);margin:0}
.lbl{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.fmt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--surface-2);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre;margin:0}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tcard b{font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.tcard[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.saved{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;flex-wrap:wrap}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 16px;border:1.5px dashed var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:center}
.drop b{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;color:var(--accent)}
.drop span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.dbbox{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px}
.dbbox > div{display:flex;flex-direction:column;gap:2px}
.mlist{display:flex;flex-direction:column}
.mrow{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.mlist .mrow:first-child{border-top:0}
.mrow .field{width:100%;font-size:14px;padding:8px 10px}
.mtop{display:flex;align-items:center;gap:10px}
.badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2)}
.badge.ok,.badge.manual{color:var(--good)}.badge.doubt{color:var(--gold)}.badge.none{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>

<div class="app" id="app"></div>
<div id="layer"></div>

<script>
/* ===================== costanti e utilità ===================== */
const ROLES=['P','D','C','A'];
const ROLE_NAME={P:'Portieri',D:'Difensori',C:'Centrocampisti',A:'Attaccanti'};
const ROLE_ONE={P:'Portiere',D:'Difensore',C:'Centrocampista',A:'Attaccante'};
const FORMATION={P:1,D:4,C:4,A:2};
const ROSTER={P:3,D:8,C:8,A:6};
const GROWTH_EVERY=5;
const MAX_ROSTER=30, MIN_ROSTER=14;
const KEY='fantacarriera_v1';
const FIRST=['Marco','Luca','Andrea','Matteo','Davide','Federico','Lorenzo','Alessandro','Simone','Gianluca','Nicolò','Tommaso','Riccardo','Pietro','Kevin','Mateo','João','Lucas','Youssef','Ibrahim','Kenji','Mats','Rafael','Diego','Emil','Samuel','Théo','Hugo','Nikola','Adam','Filippo','Gabriele','Edoardo','Mattia','Ciro','Salvatore','Antonio','Bruno','Oscar','Viktor'];
const SUR=['Esposito','Russo','Ferrari','Romano','Colombo','Ricci','Marino','Greco','Bruno','Gallo','Conti','De Luca','Mancini','Costa','Giordano','Rizzo','Lombardi','Moretti','Barbieri','Fontana','Santoro','Mariani','Rinaldi','Caruso','Ferrara','Galli','Martini','Leone','Longo','Gentile','Silva','Pereira','Kovač','Diallo','Okafor','Lindqvist','Novak','Moreau','Schmidt','Haddad','Tanaka','Petrov','Duarte','Vidal','Jansen','Mendes','Iovine','Capasso','Sorrentino','Amato','D\'Angelo','Palumbo','Coppola','Vitale','Serra','Bianco','Fiore','Pellegrini','Testa','Grasso'];
const SAMPLE_TEAMS=['Atletico Ma Non Troppo','Real Panzerotti','Dinamo Divano','Borussia Birra','Inter Nos','Lokomotiv Mozzarella','Sporting Spritz','Olympique Polpette'];

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const r1=x=>Math.round(x*10)/10;
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const money=m=>'€ '+(Math.abs(m)>=10?Math.round(m).toString():m.toFixed(1).replace('.',','))+' M';
const seasonLabel=s=>`${s}/${String((s+1)%100).padStart(2,'0')}`;
const ovrCls=o=>o>=85?'o-gold':o>=75?'o-hi':o>=65?'':'o-lo';

let LIST_MAP=null;
function listMap(){if(!LIST_MAP){LIST_MAP=new Map();LISTONE.p.forEach(r=>LIST_MAP.set(r[0],{name:r[1],club:LISTONE.c[r[2]],role:r[3],alt:r[4]||''}));}return LIST_MAP;}
/* con rose classiche da 25 (3 P, 8 D, 8 C, 6 A) i ruoli dubbi si correggono rispettando i numeri */
function fixRoles(teams){
  const T={D:8,C:8,A:6},ord='DCA';
  if(!teams.length||!teams.every(t=>t.players.length===25&&t.players.filter(p=>p.role==='P').length===3))return;
  teams.forEach(t=>{
    const pl=t.players.filter(p=>p.role!=='P');
    const opts=pl.map(p=>{
      const o=[{r:p.role,c:0}];if(p.alt&&p.alt!=='P'&&p.alt!==p.role)o.push({r:p.alt,c:1});
      const i=ord.indexOf(p.role);[ord[i-1],ord[i+1]].forEach(x=>{if(x&&!o.some(y=>y.r===x))o.push({r:x,c:5});});return o;
    });
    let cur=new Map([[0,{cost:0,ch:[]}]]);
    opts.forEach((o,i)=>{
      const nx=new Map();
      cur.forEach((v,k)=>{const d=Math.floor(k/100),c=k%100,a=i-d-c;
        o.forEach(op=>{const nd=d+(op.r==='D'),nc=c+(op.r==='C'),na=a+(op.r==='A');if(nd>T.D||nc>T.C||na>T.A)return;
          const nk=nd*100+nc,cost=v.cost+op.c,ex=nx.get(nk);if(!ex||cost<ex.cost)nx.set(nk,{cost,ch:[...v.ch,op.r]});});});
      cur=nx;
    });
    const fin=cur.get(T.D*100+T.C);if(fin)pl.forEach((p,i)=>{p.role=fin.ch[i];});
  });
}
/* esportazione "rosters" di Leghe Fantacalcio: fantasquadra,ID calciatore,costo — blocchi separati da $,$,$ */
function parseIdRosters(grid){
  const rows=grid.filter(r=>r.length>=2&&r.some(x=>x!==''&&x!=='$'));
  const idRows=rows.filter(r=>/^\d+$/.test(String(r[1]).trim()));
  if(idRows.length<11||idRows.length<rows.length*.7)return null;
  const map=listMap(),teams=new Map(),unknown=[];
  idRows.forEach(r=>{
    const tn=String(r[0]).trim(),id=+String(r[1]).trim(),cost=parseFloat(String(r[2]||'').replace(',','.'))||null;
    if(!teams.has(tn))teams.set(tn,{name:tn,players:[]});
    const info=map.get(id);
    if(!info){unknown.push(id);return;}
    teams.get(tn).players.push({name:info.name,role:info.role,alt:info.alt,club:info.club,cost,fcid:id,age:null,ovr:null,pot:null});
  });
  const out=[...teams.values()];fixRoles(out);
  return {teams:out,unknown};
}

}

function scoreMatch(f,c){
  if(f.nick&&c.normName===f.nick)return 20;
  if(!f.words.length)return 0;
  let s=0,matched=0;const used=new Set();
  for(const w of f.words){
    let k=c.tok.findIndex((t,i)=>!used.has(i)&&t===w);
    if(k>=0){used.add(k);s+=3;matched++;continue;}
    k=c.tok.findIndex((t,i)=>!used.has(i)&&(w.length>=4&&t.startsWith(w)||t.length>=6&&w.startsWith(t)));
    if(k>=0){used.add(k);s+=1.5;matched++;}
  }
  if(matched<f.words.length){
    // nomi scritti attaccati o staccati: "Mc Tominay" / "McTominay", "Dimarco" / "Di Marco"
    const j=f.words.join('');
    const pairs=c.tok.slice(0,-1).map((t,i)=>t+c.tok[i+1]);
    const hit=x=>x.length>=5&&(c.tok.includes(x)||pairs.includes(x));
    if(!(hit(j)||hit(f.all)||f.words.length===1&&pairs.includes(f.words[0])))return 0;
    s=3*f.words.length;used.clear();
  }
  for(const ini of f.inits)s+=c.tok.some((t,i)=>!used.has(i)&&t.startsWith(ini))?1:-1.2;
  if(f.clubK&&c.clubK)s+=sameClub(f.clubK,c.clubK)?2:-1;
  if(f.role&&c.role){if(f.role===c.role)s+=.5;else if(f.role==='P'||c.role==='P')s-=3;}
  s-=(c.tok.length-used.size)*.05;
  return s>=2?s:0;
}
function runMatching(teams){
  const db=getDB(),out=[];
  teams.forEach((t,ti)=>t.players.forEach((pl,pi)=>{
    if(pl.ovr!=null)return;
    const f=fantaKey(pl),sc=[];
    db.players.forEach((c,i)=>{const s=scoreMatch(f,c);if(s>0)sc.push({i,s});});
    sc.sort((a,b)=>b.s-a.s);const cands=sc.slice(0,6);
    let status='none',sel=-1;
    if(cands.length){sel=cands[0].i;status=(cands[1]&&cands[0].s-cands[1].s<1)?'doubt':'ok';}
    out.push({t:ti,p:pi,cands:cands.map(x=>x.i),sel,status,extra:[]});
  }));
  const cnt={};out.forEach(m=>{if(m.sel>=0)cnt[m.sel]=(cnt[m.sel]||0)+1;});
  out.forEach(m=>{if(m.sel>=0&&cnt[m.sel]>1&&m.status==='ok')m.status='doubt';});
  return out;
}

function parseFifaGrid(grid){

function value(p){

function bestXI(tid){
  const sq=squad(tid).sort((a,b)=>b.ovr-a.ovr);const xi=[],used=new Set();
  for(const r of ROLES){let n=FORMATION[r];for(const p of sq){if(!n)break;if(p.role===r&&!used.has(p.id)){xi.push(p);used.add(p.id);n--;}}}
  for(const p of sq){if(xi.length>=11)break;if(!used.has(p.id)&&p.role!=='P'){xi.push(p);used.add(p.id);}}
  return xi;
}
function setBest(){const ids=new Set(bestXI(S.my).map(p=>p.id));squad(S.my).forEach(p=>p.starter=ids.has(p.id));}
function myXIValid(){const st=squad(S.my).filter(p=>p.starter);return st.length===11&&st.some(p=>p.role==='P');}
function lineup(tid){if(tid===S.my&&myXIValid())return squad(tid).filter(p=>p.starter);return bestXI(tid);}
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
function rating(xi){
  const by=r=>xi.filter(p=>p.role===r).map(p=>p.ovr);
  const all=avg(xi.map(p=>p.ovr))??50,pen=(11-xi.length)*3;
  const gk=avg(by('P'))??all-15,d=avg(by('D'))??all,c=avg(by('C'))??all,a=avg(by('A'))??all;
  return {att:a*.6+c*.4-pen,def:d*.6+gk*.4-pen,mid:c-pen};
}
const lam=(x,y,home)=>clamp(1.25*Math.exp((x.att-y.def)/16+(x.mid-y.mid)/40)+(home?.25:0),.15,4.5);
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
const SW={P:.02,D:.35,C:1,A:2.6};
function scorers(xi,n,team){
  const out=[];
  for(let i=0;i<n;i++){
    const w=xi.map(p=>SW[p.role]*Math.pow(p.ovr/75,3));let r=Math.random()*w.reduce((s,x)=>s+x,0),k=0;
    while(r>w[k]&&k<w.length-1){r-=w[k];k++;}
    const p=xi[k];p.goals++;p.sGoals++;out.push({pid:p.id,name:p.name,team,min:ri(1,90)});
  }
  return out;
}
function growthCheck(p){
  const prob=growthProb(p);
  if(prob>0&&Math.random()<prob){
    const gap=p.pot-p.ovr;const inc=Math.min(gap,1+(Math.random()<.35)+(Math.random()<.12));
    p.ovr+=inc;p.hist.push({s:S.season,r:S.round+1,d:inc});
    if(isMine(p))addNews(`<b>${esc(p.name)} +${inc}</b> dopo ${GROWTH_EVERY} presenze: ora ha OVR ${p.ovr}.`,'grow');
  }
}
function playRound(){
  if(S.round>=S.fixtures.length)return;
  if(!myXIValid()){setBest();toast('Formazione incompleta: ho schierato la migliore disponibile.');}
  S.fixtures[S.round].forEach(m=>{
    const xh=lineup(m.h),xa=lineup(m.a),rh=rating(xh),ra=rating(xa);
    m.hg=poisson(lam(rh,ra,true));m.ag=poisson(lam(ra,rh,false));
    m.ovH=Math.round(avg(xh.map(p=>p.ovr)));m.ovA=Math.round(avg(xa.map(p=>p.ovr)));
    m.ev=[...scorers(xh,m.hg,m.h),...scorers(xa,m.ag,m.a)].sort((a,b)=>a.min-b.min);
    [...xh,...xa].forEach(p=>{p.apps++;p.sApps++;p.appsSince++;if(p.appsSince>=GROWTH_EVERY){p.appsSince=0;growthCheck(p);}});
    if(m.h===S.my||m.a===S.my){

      const opp=teamName(mineH?m.a:m.h);

    }

  if(S.round===S.fixtures.length){S.seasonDone=true;addNews('Ultima giornata giocata. Chiudi la stagione per incassare i premi e passare alla prossima.','season');}

  S.fixtures.forEach(rd=>rd.forEach(m=>{

    H.g++;A.g++;H.gf+=m.hg;H.gs+=m.ag;A.gf+=m.ag;A.gs+=m.hg;
    if(m.hg>m.ag){H.v++;A.p++;H.pt+=3;H.form.push('V');A.form.push('P');}

    else{H.n++;A.n++;H.pt++;A.pt++;H.form.push('N');A.form.push('N');}
  }));
  return T.sort((a,b)=>b.pt-a.pt||(b.gf-b.gs)-(a.gf-a.gs)||b.gf-a.gf||a.name.localeCompare(b.name));

  if(kind==='sign'){S.budget-=a.price;p.team=S.my;p.starter=false;addNews(`Ingaggiato lo svincolato ${esc(p.name)} (${money(a.price)}).`,'market');}

    const to=pick(S.teams.filter(t=>t.id!==S.my).map(t=>t.id));
    S.budget+=a.price;p.team=to;p.starter=false;addNews(`Ceduto ${esc(p.name)} a ${esc(teamName(to))} per ${money(a.price)}.`,'market');
  }
  if(kind==='loanOut'){
    const opts=S.teams.filter(t=>t.id!==S.my).map(t=>t.id);
    const to=opts.map(id=>({id,n:squad(id).filter(x=>x.role===p.role&&x.ovr>p.ovr).length})).sort((a,b)=>a.n-b.n)[0].id;
    S.budget+=a.price;p.loanFrom=S.my;p.team=to;p.starter=false;
    addNews(`${esc(p.name)} va in prestito a ${esc(teamName(to))} fino a fine stagione (+${money(a.price)}).`,'market');
  }
  S.budget=r1(S.budget);
  if(p.team===S.my||from===S.my){if(!myXIValid())setBest();}
  ui.sheet=null;save();render();toast(`${a.label}: fatto.`);
}

/* ===================== fine stagione ===================== */
function endSeason(){
  const T=table(),n=T.length,pos=T.findIndex(t=>t.id===S.my)+1;
  const prize=r1(15+(n-pos)/(n-1)*35);
  const summary={season:S.season,champ:T[0].name,pos,n,prize,retired:[],declined:[],youth:null,returned:[]};
  S.budget=r1(S.budget+prize);
  Object.values(S.players).forEach(p=>{
    if(p.loanFrom!=null){if(p.loanFrom===S.my||p.team===S.my)summary.returned.push(p.name);p.team=p.loanFrom;p.loanFrom=null;p.starter=false;}
  });
  Object.values(S.players).forEach(p=>{
    p.age++;p.sApps=0;p.sGoals=0;
    if(p.age>=31&&Math.random()<.35+(p.age-31)*.1){
      const d=Math.min(p.ovr-45,ri(1,p.age>=34?4:2));
      if(d>0){p.ovr-=d;p.pot=Math.max(p.ovr,p.pot-d);p.hist.push({s:S.season,r:'fine',d:-d});if(p.team===S.my)summary.declined.push(`${p.name} −${d}`);}
    }
    if(p.pot<p.ovr)p.pot=p.ovr;
    if((p.age>=36&&Math.random()<.45)||p.age>=38){
      if(p.team===S.my)summary.retired.push(p.name);delete S.players[p.id];
    }
  });
  const base=Math.min(68,Math.round(avg(squad(S.my).map(p=>p.ovr))??66)-10);
  const y=newPlayer({...genSpec(pick(['D','C','A','C','A']),base,[17,18]),team:S.my});
  y.pot=Math.min(94,y.ovr+ri(12,24));summary.youth=`${y.name} (${ROLE_ONE[y.role]}, ${y.age} anni, OVR ${y.ovr} → POT ${y.pot})`;
  S.teams.forEach(t=>ensureRoster(t.id));
  topUpFree(8);
  addNews(`Stagione ${seasonLabel(S.season)} conclusa: vince ${esc(summary.champ)}. ${esc(teamName(S.my))} chiude ${pos}ª e incassa ${money(prize)}.`,'season');
  summary.retired.forEach(nm=>addNews(`${esc(nm)} si ritira dal calcio giocato.`,'decl'));
  summary.declined.forEach(t=>addNews(`<b>${esc(t)}</b>: inizia il calo legato all'età.`,'decl'));
  addNews(`Dalla Primavera sale ${esc(summary.youth)}.`,'grow');
  S.season++;S.round=0;S.lastRound=null;S.seasonDone=false;S.fixtures=makeFixtures(S.teams.length);
  if(squad(S.my).filter(p=>p.role==='P').length===0){newPlayer({...genSpec('P',base,[19,24]),team:S.my});}
  setBest();
  ui.sheet={type:'season',data:summary};ui.calRound=null;
  save();render();
}

/* ===================== parser rose incollate ===================== */
const ROLE_MAP={p:'P',por:'P',portiere:'P',portieri:'P',d:'D',dc:'D',dd:'D',ds:'D',b:'D',difensore:'D',difensori:'D',c:'C',m:'C',e:'C',centrocampista:'C',centrocampisti:'C',a:'A',w:'A',t:'A',pc:'A',attaccante:'A',attaccanti:'A'};
function normRole(r){
  if(r==null)return null;const t=norm(String(r).split(/[;,/|]/)[0]);if(!t)return null;
  return ROLE_MAP[t]||ROLE_MAP[t.split(' ')[0]]||null;
}
function validateTeams(teams){
  const errors=[];
  teams.forEach(t=>{
    if(t.players.length<11)errors.push(`${t.name}: ha ${t.players.length} giocatori, ne servono almeno 11.`);
    if(!t.players.some(p=>p.role==='P'))errors.push(`${t.name}: manca un portiere.`);
  });
  if(teams.length<2)errors.push('Servono almeno 2 squadre.');
  if(teams.length>20)errors.push('Puoi inserire al massimo 20 squadre.');
  return errors;
}
function parseRosters(txt){
  const teams=[],errors=[];let cur=null;
  txt.split(/\r?\n/).forEach((raw,i)=>{
    const line=raw.trim();if(!line)return;
    const m=line.match(/^(?:#+\s*|squadra\s*:\s*)(.+)$/i);
    if(m){cur={name:m[1].trim(),players:[]};teams.push(cur);return;}
    if(!cur){errors.push(`Riga ${i+1}: scrivi il nome della squadra (es. "# Real Panzerotti") prima dei giocatori.`);return;}
    const parts=line.split(/\s*[,;\t]\s*/);const name=parts[0],role=normRole(parts[1]);
    if(!name||!role){errors.push(`Riga ${i+1}: serve almeno "Nome, Ruolo" con ruolo P, D, C o A.`);return;}
    let club='';if(parts[2]&&!/^\d+$/.test(parts[2])){club=parts[2];parts.splice(2,1);}
    const num=k=>{const v=parseInt(parts[k],10);return Number.isFinite(v)?v:null;};
    const ovr=num(3)!=null?clamp(num(3),40,99):null;
    cur.players.push({name,role,club,age:num(2)!=null?clamp(num(2),15,45):null,ovr,pot:num(4)!=null?clamp(num(4),40,99):null});
  });
  return {teams,errors:errors.concat(validateTeams(teams))};
}
/* file: CSV o Excel */
function csvToGrid(text){
  text=text.replace(/^﻿/,'');
  const sample=text.split(/\r?\n/).slice(0,30).join('\n');
  const cnt=d=>sample.split(d).length-1;
  const delim=[';',',','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=ch;
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows.map(r=>r.map(c=>c.trim()));
}
function loadXLSX(){
  return new Promise((res,rej)=>{
    if(window.XLSX)return res(window.XLSX);
    const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error('load'));s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);
  });
}
async function readGrid(file){
  if(/\.(xlsx|xlsm|xls|ods)$/i.test(file.name)){
    const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:'array'});let grid=[];
    wb.SheetNames.forEach(sn=>{grid=grid.concat(X.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false}),[[]]);});
    return grid.map(r=>r.map(c=>String(c??'').trim()));
  }
  return csvToGrid(await file.text());
}
/* Rose di Leghe Fantacalcio: blocchi "Nome squadra" + intestazione Ruolo | Calciatore | Squadra | Costo, anche affiancati */
function parseLegheGrid(grid){
  const cell=(r,c)=>String((grid[r]||[])[c]??'').trim();
  const isHdrRole=h=>/^(ruolo|ruoli|r)$/.test(h);
  // formato a righe: una colonna dice di quale fantasquadra è ogni giocatore
  for(let r=0;r<Math.min(grid.length,15);r++){
    const H=(grid[r]||[]).map(norm);
    const roleC=H.findIndex(isHdrRole),teamC=H.findIndex(h=>/fantasquadra|squadra fanta|fanta squadra|^fanta|^team$|proprietario|allenatore|^manager$/.test(h));
    const nameC=H.findIndex(h=>/calciator|giocator|^nome$|^player$/.test(h));
    if(roleC>=0&&teamC>=0&&nameC>=0){
      const clubC=H.findIndex((h,i)=>i!==teamC&&/^squadra|^club|serie a/.test(h)),costC=H.findIndex(h=>/costo|prezzo|crediti|valore/.test(h));
      const map=new Map();
      for(let rr=r+1;rr<grid.length;rr++){
        const tn=cell(rr,teamC),role=normRole(cell(rr,roleC)),nm=cell(rr,nameC);if(!tn||!role||!nm)continue;
        if(!map.has(tn))map.set(tn,{name:tn,players:[]});
        map.get(tn).players.push({name:nm,role,club:clubC>=0?cell(rr,clubC):'',cost:costC>=0?parseFloat(cell(rr,costC).replace(',','.'))||null:null,age:null,ovr:null,pot:null});
      }
      return {teams:[...map.values()]};
    }
  }
  const teams=[];
  for(let r=0;r<grid.length;r++){
    const row=grid[r]||[];
    for(let c=0;c<row.length;c++){
      if(!isHdrRole(norm(row[c])))continue;
      let nameC=-1,clubC=-1,costC=-1;
      for(let k=c+1;k<=c+6;k++){
        const h=norm(cell(r,k));if(isHdrRole(h))break;
        if(nameC<0&&/calciator|giocator|^nome/.test(h))nameC=k;
        else if(clubC<0&&/^squadra|^club|serie a/.test(h))clubC=k;
        else if(costC<0&&/costo|prezzo|crediti|valore|quot/.test(h))costC=k;
      }
      if(nameC<0){if(norm(row[c])==='r')continue;nameC=c+1;}
      let tname=null;
      for(let up=r-1;up>=Math.max(0,r-3)&&!tname;up--)for(let k=c;k<=c+3;k++){const t=cell(up,k);if(t&&!/crediti|ruolo|calciatore|^\d+$/i.test(t)){tname=t;break;}}
      const players=[];
      for(let rr=r+1;rr<grid.length;rr++){
        const rv=cell(rr,c);
        if(!rv){if(players.length)break;continue;}
        if(/crediti|totale|residui/i.test(rv)||isHdrRole(norm(rv)))break;
        const role=normRole(rv),nm=cell(rr,nameC);
        if(!role||!nm){if(players.length)break;continue;}
        players.push({name:nm,role,club:clubC>=0?cell(rr,clubC):'',cost:costC>=0?parseFloat(cell(rr,costC).replace(',','.'))||null:null,age:null,ovr:null,pot:null});
      }
      if(players.length)teams.push({name:tname||`Squadra ${teams.length+1}`,players});
    }
  }
  return {teams};
}

  const T=table();
  return `<div class="card tbl-wrap"><table><thead><tr><th>#</th><th>Squadra</th><th>G</th>${compact?'':'<th>V</th><th>N</th><th>P</th>'}<th>DR</th><th>Pt</th></tr></thead><tbody>
  ${T.map((t,i)=>`<tr class="${t.id===S.my?'me':''}"><td>${i+1}</td><td>${esc(t.name)}${compact?'':` <span class="form">${t.form.slice(-5).map(f=>`<i class="${f}"></i>`).join('')}</span>`}</td><td>${t.g}</td>${compact?'':`<td>${t.v}</td><td>${t.n}</td><td>${t.p}</td>`}<td>${t.gf-t.gs>0?'+':''}${t.gf-t.gs}</td><td class="pt">${t.pt}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function resultsHTML(rd){
  const ms=S.fixtures[rd]||[];
  return `<div class="card res-list">${ms.map(m=>{
    const me=m.h===S.my||m.a===S.my;const played=m.hg!=null;
    const scr=played&&m.ev.length?`<div class="scr">${m.ev.map(e=>`${esc(e.name)} ${e.min}'`).join(' · ')}</div>`:'';
    return `<div class="res ${me?'me':''}"><span class="h">${esc(teamName(m.h))}</span><span class="s num">${played?`${m.hg} – ${m.ag}`:'–'}</span><span class="a">${esc(teamName(m.a))}</span>${scr}</div>`;
  }).join('')}</div>`;
}
function renderClub(){
  let next='';
  if(S.seasonDone){
    const pos=table().findIndex(t=>t.id===S.my)+1;
    next=`<section class="next"><div class="pitch"></div><div class="eyebrow">Stagione ${seasonLabel(S.season)} · conclusa</div>
      <div class="vs" style="grid-template-columns:1fr"><div class="t"><div class="nm">${pos}° posto</div><div class="ov">Chiudi la stagione per i premi, i ritorni dai prestiti, l'età che avanza e un nuovo giovane dalla Primavera.</div></div></div>
      <button class="btn big" data-a="endseason">Chiudi la stagione</button></section>`;
  }else{
    const m=myMatch(S.round);const xiMine=lineup(S.my);
    const ov=tid=>tid===S.my?Math.round(avg(xiMine.map(p=>p.ovr))):Math.round(avg(bestXI(tid).map(p=>p.ovr)));
    next=`<section class="next"><div class="pitch"></div>
      <div class="eyebrow">Giornata ${S.round+1} di ${S.fixtures.length}</div>
      ${m?`<div class="vs"><div class="t"><div class="nm">${m.h===S.my?'<span class="mine-mark"></span>':''}${esc(teamName(m.h))}</div><div class="ov num">OVR titolari ${ov(m.h)} · casa</div></div>
        <div class="x">VS</div>
        <div class="t"><div class="nm">${m.a===S.my?'<span class="mine-mark"></span>':''}${esc(teamName(m.a))}</div><div class="ov num">trasferta · OVR titolari ${ov(m.a)}</div></div></div>`
        :`<div class="vs" style="grid-template-columns:1fr"><div class="t"><div class="nm">Turno di riposo</div></div></div>`}
      <button class="btn big" data-a="play">Gioca giornata</button></section>`;
  }
  let last='';
  if(S.lastRound!=null){
    const m=myMatch(S.lastRound);
    const board=m?`<div class="card board"><div class="eyebrow" style="margin-bottom:10px">Giornata ${S.lastRound+1} · la tua partita</div>
      <div class="score"><span class="nm">${esc(teamName(m.h))}</span><span class="dig num">${m.hg}–${m.ag}</span><span class="nm r">${esc(teamName(m.a))}</span></div>
      <div class="scorers"><div>${m.ev.filter(e=>e.team===m.h).map(e=>`${esc(e.name)} ${e.min}'`).join('<br>')||'&nbsp;'}</div><div class="r">${m.ev.filter(e=>e.team===m.a).map(e=>`${esc(e.name)} ${e.min}'`).join('<br>')||'&nbsp;'}</div></div></div>`:'';
    last=`<section>${board}</section><section><div class="sec-h"><h2>Risultati</h2><span class="eyebrow">Giornata ${S.lastRound+1}</span></div>${resultsHTML(S.lastRound)}</section>`;
  }
  const news=S.news.slice(0,4);
  return `${next}${last}
    <section><div class="sec-h"><h2>Classifica</h2><span class="eyebrow">${seasonLabel(S.season)}</span></div>${tableHTML(false)}</section>
    <section><div class="sec-h"><h2>Ultime notizie</h2><button class="btn sm" data-a="tab" data-t="news">Tutte</button></div>${newsHTML(news)}</section>`;
}
function pips(p){
  const left=GROWTH_EVERY-p.appsSince;
  return `<span class="pips" title="Controllo crescita tra ${left} presenze">${Array.from({length:GROWTH_EVERY},(_,i)=>`<i class="${i<p.appsSince?'on':''}"></i>`).join('')}</span>`;
}
function prow(p,opts={}){
  const tags=[];
  if(p.loanFrom!=null&&p.team===S.my)tags.push('<span class="tag loan">Prestito</span>');
  const right=opts.price!=null?`<button class="btn sm buy num" data-a="open" data-id="${p.id}">${money(opts.price)}</button>`
    :opts.toggle?`<button class="st" data-a="star" data-id="${p.id}" aria-pressed="${p.starter}" aria-label="${p.starter?'Togli dai titolari':'Metti titolare'}">${IC.check}</button>`:'<span></span>';
  return `<div class="prow"><span class="role ${p.role}">${p.role}</span>
    <button class="pmain" data-a="open" data-id="${p.id}"><span class="pname">${esc(p.name)}</span>
      <span class="psub num">${p.age} anni${opts.team?` · ${esc(teamName(p.team))}`:p.club?` · ${esc(p.club)}`:''} · ${money(value(p))} ${tags.join('')} ${opts.pips!==false?pips(p):''}</span></button>
    <span class="ovr num"><b class="${ovrCls(p.ovr)}">${p.ovr}</b><small>POT ${p.pot}</small></span>${right}</div>`;
}
function renderRosa(){
  const sq=squad(S.my);const st=sq.filter(p=>p.starter);
  const away=Object.values(S.players).filter(p=>p.loanFrom===S.my);
  const ord=(a,b)=>(b.starter-a.starter)||(b.ovr-a.ovr);
  const xiOk=myXIValid();
  return `<section class="card summary">
      <div><div class="k">Titolari</div><div class="v num" style="color:${xiOk?'inherit':'var(--bad)'}">${st.length}/11</div></div>
      <div><div class="k">OVR titolari</div><div class="v num">${st.length?Math.round(avg(st.map(p=>p.ovr))):'–'}</div></div>
      <div><div class="k">Rosa</div><div class="v num">${sq.length}/${MAX_ROSTER}</div></div>
      <button class="btn sm" data-a="best">Formazione migliore</button>
    </section>
    <p class="note" style="margin:-8px 0 0">Modulo 4-4-2. I pallini gialli contano le presenze: ogni ${GROWTH_EVERY} presenze il giocatore tenta un salto di overall.</p>
    <section class="card plist">${ROLES.map(r=>{const g=sq.filter(p=>p.role===r).sort(ord);return `<div class="group-h"><span>${ROLE_NAME[r]}</span><span>${g.filter(p=>p.starter).length}/${FORMATION[r]} titolari</span></div>${g.map(p=>prow(p,{toggle:true})).join('')}`;}).join('')}</section>
    ${away.length?`<section><div class="sec-h"><h2>In prestito altrove</h2></div><div class="card plist">${away.map(p=>prow(p,{team:true})).join('')}</div></section>`:''}`;
}
function renderCal(){
  const cur=ui.calRound??(S.lastRound??0);
  return `<section><div class="sec-h"><h2>Calendario</h2><span class="eyebrow">${seasonLabel(S.season)}</span></div>
    <div class="rounds">${S.fixtures.map((rd,i)=>`<button class="${rd[0]&&rd[0].hg!=null?'done':''}" data-a="cal" data-r="${i}" aria-pressed="${i===cur}">${i+1}</button>`).join('')}</div></section>
    <section><div class="sec-h"><h2>Giornata ${cur+1}</h2><span class="eyebrow">${i18nRound(cur)}</span></div>${resultsHTML(cur)}</section>
    <section><div class="sec-h"><h2>Classifica</h2></div>${tableHTML(true)}</section>`;
}
function i18nRound(r){return r<S.round?'Giocata':r===S.round?'Prossima':'Da giocare';}
function mktRows(){
  let list=Object.values(S.players).filter(p=>ui.mkt==='free'?p.team==null:(p.team!=null&&p.team!==S.my));
  if(ui.mkt==='teams'&&ui.mktTeam!=='all')list=list.filter(p=>p.team===+ui.mktTeam);
  if(ui.mktRole!=='all')list=list.filter(p=>p.role===ui.mktRole);
  const q=ui.mktQ.trim().toLowerCase();if(q)list=list.filter(p=>p.name.toLowerCase().includes(q));
  const price=p=>ui.mkt==='free'?PRICE.sign(p):PRICE.buy(p);
  const sorters={ovr:(a,b)=>b.ovr-a.ovr,pot:(a,b)=>b.pot-a.pot,age:(a,b)=>a.age-b.age,price:(a,b)=>price(a)-price(b)};
  list.sort(sorters[ui.mktSort]);
  const total=list.length;list=list.slice(0,60);
  if(!total)return `<div class="empty">Nessun giocatore con questi filtri.</div>`;
  return list.map(p=>prow(p,{price:p.loanFrom!=null?null:price(p),team:ui.mkt==='teams',pips:false})).join('')+(total>60?`<div class="empty">Mostro 60 giocatori su ${total}. Usa i filtri per restringere.</div>`:'');
}
function renderMkt(){
  return `<section class="card summary"><div><div class="k">Budget</div><div class="v num">${money(S.budget)}</div></div>
      <div><div class="k">Rosa</div><div class="v num">${squad(S.my).length}/${MAX_ROSTER}</div></div>
      <div class="note" style="flex:1 1 200px">Nessuna trattativa: paghi il prezzo e il giocatore è tuo. Prestiti fino a fine stagione.</div></section>
    <section class="toolbar">
      <div class="seg"><button data-a="mkt" data-m="free" aria-pressed="${ui.mkt==='free'}">Svincolati</button><button data-a="mkt" data-m="teams" aria-pressed="${ui.mkt==='teams'}">Altre squadre</button></div>
      <div class="seg">${['all',...ROLES].map(r=>`<button data-a="mktrole" data-r="${r}" aria-pressed="${ui.mktRole===r}">${r==='all'?'Tutti':r}</button>`).join('')}</div>
    </section>
    <section class="toolbar">
      <input class="field" id="mq" placeholder="Cerca per nome" value="${esc(ui.mktQ)}" style="flex:1 1 160px">
      <select class="field" id="msort" aria-label="Ordina"><option value="ovr">Overall</option><option value="pot">Potenziale</option><option value="age">Più giovani</option><option value="price">Prezzo</option></select>
      ${ui.mkt==='teams'?`<select class="field" id="mteam" aria-label="Squadra"><option value="all">Tutte le squadre</option>${S.teams.filter(t=>t.id!==S.my).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>`:''}
    </section>
    <section class="card plist" id="mlist">${mktRows()}</section>`;
}
function newsHTML(items){
  if(!items.length)return `<div class="card empty">Ancora nessuna notizia.</div>`;
  return `<div class="card news">${items.map(n=>`<div class="ni ${n.kind}"><span class="when num">${n.r?`G${n.r}`:'Inizio'}<br>${seasonLabel(n.s)}</span><span class="txt"><span class="dot"></span>${n.t}</span></div>`).join('')}</div>`;
}
function renderNews(){return `<section><div class="sec-h"><h2>Notizie</h2><span class="eyebrow">${S.news.length} eventi</span></div>${newsHTML(S.news)}</section>`;}

/* ===================== sheet ===================== */
function playerSheet(p,confirm){
  const mineOwned=p.team===S.my&&p.loanFrom==null, loanedIn=p.team===S.my&&p.loanFrom!=null, loanedOut=p.loanFrom===S.my;
  const prob=Math.round(growthProb(p)*100);
  const actions=[];
  if(mineOwned)actions.push('sell','loanOut');
  else if(p.team==null)actions.push('sign');
  else if(!loanedIn&&!loanedOut&&p.loanFrom==null)actions.push('buy','loanIn');
  let body;
  if(confirm){
    const a=actionInfo(confirm,p);const after=r1(S.budget+a.sign*a.price);
    const note={buy:`Il giocatore lascia ${esc(teamName(p.team))} e resta tuo a titolo definitivo.`,loanIn:`Torna a ${esc(teamName(p.team))} a fine stagione.`,sign:'Arriva a parametro zero, paghi solo l\'ingaggio.',sell:'Il giocatore passa a una delle altre squadre.',loanOut:'Va dove ha più spazio per giocare, così continua a crescere. Torna a fine stagione.'}[confirm];
    body=`<div class="confirm"><b>${a.label}: ${esc(p.name)}</b>
      <div class="kv"><span>${a.sign<0?'Costo':'Incasso'}</span><b>${money(a.price)}</b></div>
      <div class="kv"><span>Budget dopo l'operazione</span><b style="color:${after<0?'var(--bad)':'inherit'}">${money(after)}</b></div>
      <div class="note">${note}</div>${a.err?`<div class="err">${esc(a.err)}</div>`:''}
      <div class="row"><button class="btn" data-a="unconfirm">Annulla</button><button class="btn primary" data-a="confirm" data-k="${confirm}" data-id="${p.id}" ${a.err?'disabled':''}>Conferma</button></div></div>`;
  }else{
    body=`<div class="row">${actions.map(k=>{const a=actionInfo(k,p);return `<button class="btn ${k==='sell'?'danger':k==='buy'||k==='sign'?'primary':''}" data-a="ask" data-k="${k}" data-id="${p.id}">${a.label} · ${money(a.price)}</button>`;}).join('')}
      ${p.team===S.my?`<button class="btn" data-a="star" data-id="${p.id}">${p.starter?'Togli dai titolari':'Metti titolare'}</button>`:''}</div>
      ${p.loanFrom!=null&&!loanedIn&&!loanedOut?`<p class="note">In prestito a ${esc(teamName(p.team))} da ${esc(teamName(p.loanFrom))}: non è in vendita fino a fine stagione.</p>`:''}`;
  }
  const where=loanedIn?`In prestito da ${esc(teamName(p.loanFrom))}`:loanedOut?`Tuo, in prestito a ${esc(teamName(p.team))}`:esc(teamName(p.team));
  const pct=x=>clamp((x-40)/(99-40)*100,0,100);
  return `<div class="stack">
    <div style="display:flex;gap:12px;align-items:center"><span class="role ${p.role}" style="width:40px;height:40px;font-size:18px;border-radius:10px">${p.role}</span>
      <div style="min-width:0;flex:1"><h2>${esc(p.name)}</h2><div class="muted">${ROLE_ONE[p.role]} · ${p.age} anni · ${where}${p.club?` · ${esc(p.club)}`:''}</div>
        <div class="note">${p.src==='fifa'?`Valori FIFA di ${esc(p.fifa||p.name)}`:p.src==='stima'?'Non trovato nel database FIFA: valori stimati':p.src==='manuale'?'Valori inseriti da te':'Giocatore generato dal gioco'}</div></div>
      <button class="icon-btn" data-a="close" aria-label="Chiudi">✕</button></div>
    <div><div class="kv" style="margin-bottom:6px"><span>Overall <b class="${ovrCls(p.ovr)}" style="font-size:18px">${p.ovr}</b></span><span>Potenziale <b>${p.pot}</b></span></div>
      <div class="bar"><em style="width:${pct(p.pot)}%"></em><span style="width:${pct(p.ovr)}%"></span></div></div>
    <div class="stats num"><div><b>${p.sApps}</b><span>Presenze stagione</span></div><div><b>${p.sGoals}</b><span>Gol stagione</span></div><div><b>${money(value(p))}</b><span>Valore</span></div></div>
    <div class="confirm" style="gap:6px"><span class="eyebrow">Crescita</span>
      ${p.pot>p.ovr?`<div class="kv"><span>Prossimo controllo</span><b>tra ${GROWTH_EVERY-p.appsSince} presenze ${pips(p)}</b></div>
      <div class="kv"><span>Probabilità di crescere</span><b>${prob}%</b></div>
      <div class="note">Se il controllo riesce: da +1 a +3 di overall. La probabilità cala con l'età e quando l'overall si avvicina al potenziale. Senza presenze non cresce.</div>`
      :`<div class="note">Ha raggiunto il suo potenziale. ${p.age>=31?'Dai 31 anni in su a fine stagione può calare.':''}</div>`}
      ${p.hist.length?`<div class="note">Storico: ${p.hist.slice(-8).map(h=>`<b style="color:${h.d>0?'var(--good)':'var(--bad)'}">${h.d>0?'+':''}${h.d}</b> ${seasonLabel(h.s).slice(2)} ${h.r==='fine'?'fine':'G'+h.r}`).join(' · ')}</div>`:''}
    </div>
    ${body}</div>`;
}
function seasonSheet(d){
  return `<div class="stack"><div class="eyebrow">Stagione ${seasonLabel(d.season)}</div><h2>${d.pos===1?'Campioni!':`${d.pos}° posto su ${d.n}`}</h2>
    <div class="confirm">
      <div class="kv"><span>Vincitore</span><b>${esc(d.champ)}</b></div>
      <div class="kv"><span>Premio piazzamento</span><b>+${money(d.prize)}</b></div>
      <div class="kv"><span>Budget</span><b>${money(S.budget)}</b></div></div>
    <div class="note"><b>Dalla Primavera:</b> ${esc(d.youth)}</div>
    ${d.returned.length?`<div class="note"><b>Fine prestiti:</b> ${d.returned.map(esc).join(', ')}</div>`:''}
    ${d.declined.length?`<div class="note"><b>Calo per l'età:</b> ${d.declined.map(esc).join(', ')}</div>`:''}
    ${d.retired.length?`<div class="note"><b>Ritirati:</b> ${d.retired.map(esc).join(', ')}</div>`:''}
    <button class="btn primary big" data-a="close">Inizia la ${seasonLabel(S.season)}</button></div>`;
}
function menuSheet(sub){
  if(sub==='export'){
    return `<div class="stack"><h2>Esporta</h2><p class="note">Copia questo testo e conservalo: puoi ricaricarlo da "Importa" su un altro dispositivo.</p>
      <textarea class="field" id="exp" readonly>${esc(JSON.stringify(S))}</textarea>
      <div class="row"><button class="btn" data-a="menu">Indietro</button><button class="btn primary" data-a="copy">Copia</button></div></div>`;
  }
  if(sub==='import'){
    return `<div class="stack"><h2>Importa</h2><p class="note">Incolla un salvataggio esportato. Sostituisce la carriera attuale.</p>
      <textarea class="field" id="imp" placeholder="Incolla qui il salvataggio"></textarea><div class="err" id="imperr"></div>
      <div class="row"><button class="btn" data-a="menu">Indietro</button><button class="btn primary" data-a="import-do">Carica</button></div></div>`;
  }
  if(sub==='new'){
    return `<div class="stack"><h2>Nuova carriera</h2><p>La carriera con ${esc(teamName(S.my))} verrà cancellata da questo browser. Se vuoi tenerla, esportala prima.</p>
      <div class="row"><button class="btn" data-a="menu">Annulla</button><button class="btn danger" data-a="new-do">Cancella e ricomincia</button></div></div>`;
  }
  if(sub==='rules'){
    return `<div class="stack"><h2>Come funziona</h2>
      <p class="note"><b>Partite.</b> Ogni squadra schiera un 4-4-2. Attacco, difesa e centrocampo si calcolano dagli overall dei titolari, poi i gol si estraggono a caso con una distribuzione di Poisson. Chi gioca in casa ha un piccolo vantaggio.</p>
      <p class="note"><b>Dati.</b> Overall, potenziale ed età vengono dal database ${esc(S.db||FC_LABEL)} (fonte FIFACM). I giocatori di Serie A che non sono in nessuna rosa della lega sono svincolati.</p>
      <p class="note"><b>Crescita.</b> Ogni ${GROWTH_EVERY} presenze un giocatore tenta un salto: se riesce guadagna da +1 a +3 di overall, mai oltre il potenziale. Giovani e lontani dal potenziale crescono più spesso; dai 33 anni non si cresce più. Dai 31 anni, a fine stagione, si può calare.</p>
      <p class="note"><b>Mercato.</b> Prezzo fisso in base a overall, età e potenziale. Comprare da un'altra squadra costa il 15% in più; un prestito costa il 20% del valore; uno svincolato il 40%. Vendendo incassi l'85%.</p>
      <p class="note"><b>Fine stagione.</b> Premio da ${money(15)} a ${money(50)} in base al piazzamento, prestiti che rientrano, età +1, ritiri dai 36 anni e un nuovo giovane dalla Primavera.</p>
      <button class="btn" data-a="menu">Indietro</button></div>`;
  }
  return `<div class="stack"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Menu</h2><button class="icon-btn" data-a="close" aria-label="Chiudi">✕</button></div>
    <button class="btn" data-a="menu" data-s="rules">Come funziona</button>
    <button class="btn" data-a="menu" data-s="export">Esporta salvataggio</button>
    <button class="btn" data-a="menu" data-s="import">Importa salvataggio</button>
    <button class="btn danger" data-a="menu" data-s="new">Nuova carriera</button>
    <p class="note">La partita si salva da sola in questo browser dopo ogni azione.</p></div>`;
}
function renderSheet(){
  const L=document.getElementById('layer');const sh=ui.sheet;
  if(!sh){L.innerHTML='';return;}
  let html='';
  if(sh.type==='player'){const p=S.players[sh.pid];if(!p){ui.sheet=null;L.innerHTML='';return;}html=playerSheet(p,sh.confirm);}
  if(sh.type==='season')html=seasonSheet(sh.data);
  if(sh.type==='menu')html=menuSheet(sh.sub);
  L.innerHTML=`<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
}

/* ===================== render principale ===================== */
function render(){
  const app=document.getElementById('app');
  if(ui.screen==='setup'||!S){app.innerHTML=renderSetup();renderSheet();return;}
  const body={club:renderClub,rosa:renderRosa,cal:renderCal,mkt:renderMkt,news:renderNews}[ui.tab]();
  app.innerHTML=header()+`<main>${body}</main>`+nav();
  const ms=document.getElementById('msort');if(ms)ms.value=ui.mktSort;
  const mt=document.getElementById('mteam');if(mt)mt.value=String(ui.mktTeam);
  renderSheet();
}

/* ===================== eventi ===================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id!=null?+el.dataset.id:null;
  if(a==='scrim'){if(e.target===el&&ui.sheet&&ui.sheet.type!=='season'){ui.sheet=null;renderSheet();}return;}
  switch(a){
    case 'setup-mode':ui.setup.mode=el.dataset.m;ui.setup.errors=[];render();break;
    case 'setup-next':{
      const st=ui.setup;st.league=(document.getElementById('lg').value.trim()||'Lega degli Amici');
      st.pick=null;
      if(st.mode==='sample'){st.specs=sampleSpecs();st.matches=null;st.step=2;render();window.scrollTo(0,0);break;}
      let raw;
      if(st.mode==='paste'){const r=parseRosters(st.paste);st.errors=r.errors;if(r.errors.length){render();return;}raw=r.teams;}
      else{
        if(!st.fileTeams){st.fileErr=st.fileErr||'Scegli prima il file con le rose della lega.';render();return;}
        const errs=validateTeams(st.fileTeams);if(errs.length){st.fileErr=errs.join('\n');render();return;}
        raw=st.fileTeams;
      }
      st.raw=clone(raw);st.matches=runMatching(st.raw);st.matchFilter='check';
      if(st.matches.length){st.step='match';}else{st.specs=finalizeSpecs(st.raw,[]);st.step=2;}
      render();window.scrollTo(0,0);break;}
    case 'setup-back':{const st=ui.setup;st.step=(st.step===2&&st.matches&&st.matches.length)?'match':1;render();window.scrollTo(0,0);break;}
    case 'mfilter':ui.setup.matchFilter=el.dataset.f;render();break;
    case 'match-next':{const st=ui.setup;st.specs=finalizeSpecs(st.raw,st.matches);st.step=2;render();window.scrollTo(0,0);break;}
    case 'setup-pick':ui.setup.pick=id;render();break;
    case 'setup-start':createGame(ui.setup.league,ui.setup.specs,ui.setup.pick);ui.screen='game';ui.tab='club';save();render();window.scrollTo(0,0);break;
    case 'continue':{const d=loadSaved();if(d){adopt(d);render();}break;}
    case 'tab':ui.tab=el.dataset.t;ui.sheet=null;render();window.scrollTo(0,0);break;
    case 'play':playRound();break;
    case 'endseason':endSeason();break;
    case 'best':setBest();save();render();toast('Schierata la formazione migliore.');break;
    case 'star':{const p=S.players[id];if(!p)break;
      if(!p.starter){const st=squad(S.my).filter(x=>x.starter);if(st.length>=11){toast('Hai già 11 titolari: togline uno prima.');break;}}
      p.starter=!p.starter;save();render();break;}
    case 'open':ui.sheet={type:'player',pid:id,confirm:null};renderSheet();break;
    case 'ask':ui.sheet.confirm=el.dataset.k;renderSheet();break;
    case 'unconfirm':ui.sheet.confirm=null;renderSheet();break;
    case 'confirm':doAction(el.dataset.k,id);break;
    case 'close':ui.sheet=null;renderSheet();break;
    case 'cal':ui.calRound=+el.dataset.r;render();break;
    case 'mkt':ui.mkt=el.dataset.m;ui.mktTeam='all';render();break;
    case 'mktrole':ui.mktRole=el.dataset.r;render();break;
    case 'menu':ui.sheet={type:'menu',sub:el.dataset.s||null};renderSheet();break;
    case 'copy':{const t=document.getElementById('exp');
      const fallback=()=>{t.focus();t.select();toast('Testo selezionato: copialo dal menu del browser.');};
      try{navigator.clipboard.writeText(t.value).then(()=>toast('Salvataggio copiato.'),fallback);}catch(err){fallback();}break;}
    case 'import-do':{const t=document.getElementById('imp').value;let d=null;try{d=JSON.parse(t);}catch(err){}
      if(!d||!d.teams||!d.players||d.my==null){document.getElementById('imperr').textContent='Questo testo non è un salvataggio valido di Fantacarriera.';break;}
      adopt(d);save();render();toast('Carriera caricata.');break;}
    case 'new-do':try{localStorage.removeItem(KEY);}catch(err){}S=null;ui.screen='setup';ui.sheet=null;ui.setup.step=1;ui.setup.errors=[];render();break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='paste')ui.setup.paste=e.target.value;
  if(e.target.id==='lg')ui.setup.league=e.target.value;
  if(e.target.id==='mq'){ui.mktQ=e.target.value;const l=document.getElementById('mlist');if(l)l.innerHTML=mktRows();}
  if(e.target.dataset.msearch!=null){
    const m=ui.setup.matches[+e.target.dataset.msearch];m.q=e.target.value;const q=norm(m.q);
    m.extra=q.length<2?[]:getDB().players.map((c,i)=>({c,i})).filter(x=>norm(x.c.name+' '+(x.c.alt||'')).includes(q)).slice(0,10).map(x=>x.i);
    const sel=document.querySelector(`[data-msel="${e.target.dataset.msearch}"]`);if(sel)sel.innerHTML=matchOptions(m);
  }
});
document.addEventListener('change',async e=>{
  if(e.target.dataset.msel!=null){const m=ui.setup.matches[+e.target.dataset.msel];m.sel=+e.target.value;m.status='manual';m.fixed=true;return;}
  if(e.target.id==='file'){
    const f=e.target.files&&e.target.files[0];if(!f)return;const st=ui.setup;
    st.fileErr='';st.fileInfo=`Leggo ${f.name}…`;st.fileTeams=null;render();
    try{
      const grid=await readGrid(f);let unknown=[];
      let r=parseIdRosters(grid);
      if(r)unknown=r.unknown;else r=parseLegheGrid(grid);
      if(!r.teams.length)r=parseRosters(grid.map(row=>row.filter(x=>x!=='').join(', ')).join('\n'));
      if(!r.teams.length){st.fileInfo=f.name;st.fileErr='Non ho trovato rose in questo file. Serve l\'esportazione delle rose, con le colonne Ruolo e Calciatore.';}
      else{
        st.fileTeams=r.teams;const tot=r.teams.reduce((s,t)=>s+t.players.length,0);
        st.fileInfo=`${f.name} · ${r.teams.length} squadre · ${tot} giocatori`;
        st.fileErr=[...(unknown.length?[`${unknown.length} calciatori con ID non presente nel listone incluso (ID ${unknown.slice(0,8).join(', ')}${unknown.length>8?'…':''}): li salto.`]:[]),...validateTeams(r.teams)].join('\n');
      }
    }catch(err){st.fileInfo='';st.fileErr=err&&err.message==='load'?'Non riesco a caricare il lettore dei file Excel. Riprova, oppure esporta le rose in CSV.':'Non riesco a leggere questo file. Prova a esportarlo in CSV.';}
    render();return;
  }
  if(e.target.id==='fifafile'){
    const f=e.target.files&&e.target.files[0];if(!f)return;const st=ui.setup;st.dbErr='';
    try{const r=parseFifaGrid(await readGrid(f));if(r.error)st.dbErr=r.error;else FCDB=buildDB(r.list,`${f.name} · personalizzato`);}
    catch(err){st.dbErr='Non riesco a leggere questo file.';}
    render();return;
  }
  if(e.target.id==='msort'){ui.mktSort=e.target.value;document.getElementById('mlist').innerHTML=mktRows();}
  if(e.target.id==='mteam'){ui.mktTeam=e.target.value;document.getElementById('mlist').innerHTML=mktRows();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet&&ui.sheet.type!=='season'){ui.sheet=null;renderSheet();}});

/* ===================== avvio ===================== */
function start(data){
  if(data&&data.S){S=data.S;ui={...ui,...data.ui};usedNames.clear();Object.values(S.players).forEach(p=>usedNames.add(p.name));}
  render();
}
try{window.claude?.hot?.snapshot(()=>({S,ui}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
